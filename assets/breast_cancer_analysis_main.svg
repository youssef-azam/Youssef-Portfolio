<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    <!-- Definitions for gradients and shadows -->
    <defs>
        <!-- Background Gradient -->
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#172a45" />
            <stop offset="100%" stop-color="#0a192f" />
        </radialGradient>
        <!-- Pink Ribbon Gradient -->
        <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff758c" />
            <stop offset="50%" stop-color="#ff7eb3" />
            <stop offset="100%" stop-color="#e01a4f" />
        </linearGradient>
        <!-- Shadow Effect -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="800" height="500" fill="url(#bg-grad)" />

    <!-- High-Tech Analysis Grid -->
    <g stroke="#1e293b" stroke-width="1" opacity="0.3">
        <!-- Horizontal lines -->
        <line x1="0" y1="50" x2="800" y2="50" />
        <line x1="0" y1="100" x2="800" y2="100" />
        <line x1="0" y1="150" x2="800" y2="150" />
        <line x1="0" y1="200" x2="800" y2="200" />
        <line x1="0" y1="250" x2="800" y2="250" />
        <line x1="0" y1="300" x2="800" y2="300" />
        <line x1="0" y1="355" x2="800" y2="355" />
        <line x1="0" y1="400" x2="800" y2="400" />
        <line x1="0" y1="450" x2="800" y2="450" />
        <!-- Vertical lines -->
        <line x1="100" y1="0" x2="100" y2="500" />
        <line x1="200" y1="0" x2="200" y2="500" />
        <line x1="300" y1="0" x2="300" y2="500" />
        <line x1="400" y1="0" x2="400" y2="500" />
        <line x1="500" y1="0" x2="500" y2="500" />
        <line x1="600" y1="0" x2="600" y2="500" />
        <line x1="700" y1="0" x2="700" y2="500" />
    </g>

    <!-- Abstract Glowing Data Rings (Analytics Concept) -->
    <circle cx="400" cy="230" r="160" fill="none" stroke="#233554" stroke-width="2" stroke-dasharray="10 15" opacity="0.5" />
    <circle cx="400" cy="230" r="130" fill="none" stroke="#ff7eb3" stroke-width="1" stroke-dasharray="5 10" opacity="0.2" />
    <circle cx="400" cy="230" r="180" fill="none" stroke="#64ffda" stroke-width="1.5" stroke-dasharray="20 40" opacity="0.3" />

    <!-- Crosshairs & Tech Elements -->
    <path d="M 370 230 L 430 230 M 400 200 L 400 260" stroke="#64ffda" stroke-width="1" opacity="0.4" />
    <rect x="385" y="215" width="30" height="30" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.3" />

    <!-- Glowing Pink Ribbon Group -->
    <g filter="url(#glow)" transform="translate(400, 230) scale(1.3)">
        <!-- Ribbon loop shape -->
        <!-- Right leg -->
        <path d="M -20 100 C -30 60, -50 20, -50 -10 C -50 -45, -20 -70, 0 -70 C 20 -70, 50 -45, 50 -10 C 50 20, 30 60, 20 100" 
              fill="none" stroke="url(#pink-grad)" stroke-width="24" stroke-linecap="round" filter="url(#soft-shadow)"/>
        <!-- Ribbon fold overlay (adds 3D depth) -->
        <path d="M -20 100 C -25 75, -35 50, -45 25" fill="none" stroke="#ffccd5" stroke-width="2" opacity="0.5" filter="url(#soft-shadow)"/>
        <path d="M 20 100 C 25 75, 35 50, 45 25" fill="none" stroke="#800f2f" stroke-width="4" opacity="0.4" />
    </g>

    <!-- Medical / Health Tech Indicators -->
    <g transform="translate(50, 50)">
        <rect width="140" height="40" rx="8" fill="#172a45" stroke="#233554" stroke-width="1.5" />
        <circle cx="20" cy="20" r="6" fill="#ff758c" />
        <text x="35" y="24" fill="#a8b2d1" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">STAGE ANALYSIS</text>
    </g>
    
    <g transform="translate(610, 50)">
        <rect width="140" height="40" rx="8" fill="#172a45" stroke="#233554" stroke-width="1.5" />
        <circle cx="20" cy="20" r="6" fill="#64ffda" />
        <text x="35" y="24" fill="#a8b2d1" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">PATIENT DATA</text>
    </g>

    <!-- Titles & Metadata -->
    <text x="400" y="420" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" letter-spacing="2">BREAST CANCER ANALYSIS</text>
    <text x="400" y="450" text-anchor="middle" fill="#64ffda" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" letter-spacing="4">DIAGNOSTIC &amp; DATA INSIGHTS</text>
</svg>
